spring.application.name=attendance-gateway

spring.datasource.url=${ATTENDANCE_DB_URL:jdbc:postgresql://localhost:5432/attendance}
spring.datasource.username=${ATTENDANCE_DB_USER:attendance}
spring.datasource.password=${ATTENDANCE_DB_PASSWORD:attendance}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# RFC 9457 problem+json for every error, including ones raised before a controller runs.
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info

# Key for the administration API (devices, mappings, quarantine). When it is
# blank every administration request is rejected, so a deployment that forgets
# to set it is closed rather than open.
attendance.admin.api-key=${ATTENDANCE_ADMIN_API_KEY:}

# A punch dated further ahead than this is treated as a device clock fault.
attendance.ingest.future-tolerance=5m
attendance.ingest.max-batch-size=500

# --- Kafka -------------------------------------------------------------------
spring.kafka.bootstrap-servers=${ATTENDANCE_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# send() waits this long for broker metadata before failing. The default is 60s,
# which the outbox publisher would spend inside an open database transaction
# whenever the broker is unreachable.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=attendance-gateway.daily-summary
spring.kafka.consumer.auto-offset-reset=earliest
# Commit after each record, so a crash replays at most the record in flight.
spring.kafka.listener.ack-mode=record

# --- Outbox ------------------------------------------------------------------
attendance.outbox.poll-interval=500ms
attendance.outbox.batch-size=200
# How long the publisher waits for the broker to acknowledge a batch before
# giving up and leaving the events for the next round.
attendance.outbox.send-timeout=10s
