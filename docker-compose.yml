# `docker compose up -d` starts PostgreSQL and Kafka for running the service
# from the IDE or with `./mvnw spring-boot:run`.
# `docker compose --profile app up -d --build` also builds and runs the service.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    ports:
      - "5432:5432"
    volumes:
      - attendance-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode with two listeners: a client on the host
  # reaches it as localhost:9092, a container on this network as kafka:19092.
  # A broker tells clients where to connect, so each side needs an address it
  # can actually resolve.
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  app:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ATTENDANCE_DB_URL: jdbc:postgresql://postgres:5432/attendance
      ATTENDANCE_KAFKA_BOOTSTRAP: kafka:19092
      # A development key. Set your own in any environment that is not your laptop.
      ATTENDANCE_ADMIN_API_KEY: ${ATTENDANCE_ADMIN_API_KEY:-dev-admin-key}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

volumes:
  attendance-db:
