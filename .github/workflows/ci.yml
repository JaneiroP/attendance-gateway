name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # The integration tests start PostgreSQL with Testcontainers; the runner already has Docker.
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
